[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "april-agent"
version = "0.1.0"
description = "APRIL Agent: recursive agent harnessing backend modeled on Harness²"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX",
]
authors = [{ name = "APRIL Agent" }]
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8"]

[project.scripts]
april = "main:main"

[tool.setuptools]
py-modules = ["main", "launcher", "profile_agent"]

[tool.setuptools.packages.find]
include = ["april*"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["third_party", "dependencies"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
